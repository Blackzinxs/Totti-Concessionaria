<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Acesso - Totti Concessionaria
</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #242b36
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}


.login {
    width: 100%;
    max-width: 470px;

    background: white;

    border-radius: 18px;

    padding: 38px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.30);
}


.logo-area {
    text-align: center;
    margin-bottom: 30px;
}


.logo {
    width: 300px;
    max-width: 100%;
    max-height: 130px;

    object-fit: contain;
}


.login-titulo {
    text-align: center;
    margin-bottom: 30px;
}


.login-titulo h2 {
    margin: 0;
    color: #111827;
    font-size: 23px;
}


.login-titulo p {
    color: #6b7280;
    margin: 8px 0 0;
    font-size: 14px;
}


.campo {
    margin-bottom: 18px;
}


.campo label {
    display: block;
    margin-bottom: 7px;

    font-size: 13px;
    font-weight: bold;

    color: #374151;
}


.campo input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 15px;

    outline: none;

    transition: 0.2s;
}


.campo input:focus {
    border-color: #4b5563;

    box-shadow:
        0 0 0 3px
        rgba(75, 85, 99, 0.12);
}


.btn-login {
    width: 100%;

    background: #1f2937;
    color: white;

    border: none;

    padding: 14px;

    border-radius: 8px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}


.btn-login:hover {
    background: #111827;
}


.separador {
    display: flex;
    align-items: center;
    gap: 12px;

    margin: 25px 0;

    color: #9ca3af;
    font-size: 12px;
}


.separador::before,
.separador::after {

    content: "";

    height: 1px;
    background: #e5e7eb;
    flex: 1;
}


.btn-cadastro {
    display: block;

    width: 100%;

    text-align: center;

    background: #f3f4f6;
    color: #1f2937;

    border: 1px solid #d1d5db;

    padding: 13px;

    border-radius: 8px;

    text-decoration: none;
    font-weight: bold;

    transition: 0.2s;
}


.btn-cadastro:hover {
    background: #e5e7eb;
}


.erro {
    background: #fef2f2;
    border: 1px solid #fecaca;

    color: #991b1b;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 20px;

    font-size: 14px;
}


.sucesso {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;

    color: #166534;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 20px;

    font-size: 14px;
}


.rodape {
    margin-top: 25px;

    text-align: center;

    color: #9ca3af;

    font-size: 12px;
}


@media (max-width: 500px) {

    body {
        padding: 16px;
    }


    .login {
        padding: 25px 20px;
    }


    .logo {
        width: 250px;
    }

}

</style>

</head>


<body>


<div class="login">


    <div class="logo-area">

        <img
            src="{{ url_for('static', filename='images/logo_totti.png') }}"
            alt="Totti Concessionária"
            class="logo">

    </div>


    <div class="login-titulo">

        <h2>
            Bem-vindo
        </h2>

        <p>
            Entre para acessar a Totti Concessionaria
        </p>

    </div>


    {% if cadastro_sucesso %}

    <div class="sucesso">

        Conta criada com sucesso!
        Você já pode acessar o sistema.

    </div>

    {% endif %}


    {% if erro %}

    <div class="erro">
        {{ erro }}
    </div>

    {% endif %}


    <form method="POST">


        <div class="campo">

            <label>
                E-mail
            </label>

            <input
                type="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required>

        </div>


        <div class="campo">

            <label>
                Senha
            </label>

            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required>

        </div>


        <button
            type="submit"
            class="btn-login">

            Entrar

        </button>


    </form>


    <div class="separador">

        NOVO CLIENTE

    </div>


    <a
        href="/cadastro"
        class="btn-cadastro">

        Criar minha conta

    </a>


    <div class="rodape">

        Totti Concessionaria
        · Sistema de Gestão de Veículos

    </div>


</div>


</body>

</html>
